version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # マイナー・パッチは本番依存と開発依存ごとに 1 つの PR にまとめ、PR の数を抑える。
    # メジャーは破壊的変更の確認が必要なため、グループにせずパッケージごとの PR にする
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
